---
# Example desired-state configuration for server-bootstrap.
# Copy this layout into your own project directory outside this repository.

bootstrap_admin_user: deploy

bootstrap_admin_authorized_keys:
  - "ssh-ed25519 AAAA... example-only@bootstrap"

# Optional: load additional public keys from files relative to inventory.yml
# bootstrap_admin_authorized_key_files:
#   - keys/deploy.ed25519.pub

# Optional overrides
# bootstrap_timezone: UTC
# bootstrap_hostname: app-01.example.com
# bootstrap_locale: en_US.UTF-8
# bootstrap_upgrade_packages: false
# bootstrap_reboot_if_required: false
# bootstrap_common_packages_extra: []
# bootstrap_ssh_port: 22
# bootstrap_firewall_allowed_tcp_ports:
#   - 443
# bootstrap_firewall_allowed_udp_ports: []
