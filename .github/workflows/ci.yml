---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify toolchain versions
        run: |
          ansible --version
          ansible-lint --version
          yamllint --version
          detect-secrets --version

      - name: YAML lint
        run: yamllint .

      - name: Ansible lint
        run: ansible-lint

      - name: Ansible syntax check
        run: |
          ansible-playbook site.yml --syntax-check
          ansible-playbook verify.yml --syntax-check

      - name: Secret scan
        run: ./scripts/secret-scan.sh

      - name: Secret scan negative gate test
        run: ./scripts/test-secret-gate-negative.sh

      - name: Phase 1 synthetic preflight tests
        run: ./tests/synthetic/run-phase1-preflight-tests.sh

      - name: Wrapper unit tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py'

      - name: Repository whitespace check
        run: git diff --check
