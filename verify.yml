---
- name: Bootstrap | verify
  hosts: all
  gather_facts: true
  become: true
  any_errors_fatal: true
  vars_files:
    - vars/bootstrap_internal.yml
  tasks:
    - name: Verify | post-apply checks are not run in check mode
      ansible.builtin.debug:
        msg: NOT RUN (check mode)
      when: ansible_check_mode

    - name: Verify | common role checks
      ansible.builtin.import_role:
        name: common
        tasks_from: verify
      when:
        - not ansible_check_mode
        - bootstrap_common_enabled | default(true) | bool

    - name: Verify | users role checks
      ansible.builtin.import_role:
        name: users
        tasks_from: verify
      when:
        - not ansible_check_mode
        - bootstrap_users_enabled | default(true) | bool

    - name: Verify | ssh role checks
      ansible.builtin.import_role:
        name: ssh
        tasks_from: verify
      when:
        - not ansible_check_mode
        - bootstrap_ssh_enabled | default(true) | bool

    - name: Verify | firewall role checks
      ansible.builtin.import_role:
        name: firewall
        tasks_from: verify
      when:
        - not ansible_check_mode
        - bootstrap_firewall_enabled | default(true) | bool

    - name: Verify | security role checks
      ansible.builtin.import_role:
        name: security
        tasks_from: verify
      when:
        - not ansible_check_mode
        - bootstrap_security_enabled | default(true) | bool

    - name: Verify | docker role checks
      ansible.builtin.import_role:
        name: docker
        tasks_from: verify
      when:
        - not ansible_check_mode
        - bootstrap_docker_enabled | default(true) | bool

    - name: Verify | component opt-out warnings
      ansible.builtin.import_tasks: tasks/summary/component_opt_out_warnings.yml
      when: not ansible_check_mode

    - name: Verify | reboot-required warning
      ansible.builtin.import_tasks: tasks/summary/reboot_required_warning.yml
      when: not ansible_check_mode

    - name: Verify | bootstrap summary
      ansible.builtin.import_tasks: tasks/summary/report.yml
      when: not ansible_check_mode
