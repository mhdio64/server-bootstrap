---
- name: Bootstrap | verify
  hosts: all
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Verify | post-apply checks are not run in check mode
      ansible.builtin.debug:
        msg: NOT RUN (check mode)
      when: ansible_check_mode

    - name: Verify | common role checks
      ansible.builtin.import_role:
        name: common
        tasks_from: verify
      when:
        - not ansible_check_mode
        - bootstrap_common_enabled | default(true) | bool

    - name: Verify | users role checks
      ansible.builtin.import_role:
        name: users
        tasks_from: verify
      when:
        - not ansible_check_mode
        - bootstrap_users_enabled | default(true) | bool
