---
- name: Synthetic | docker preflight rejects missing non-admin users in bootstrap_docker_users
  hosts: localhost
  gather_facts: false
  vars:
    bootstrap_admin_user: deploy_new_admin
    bootstrap_docker_users:
      - non_existent_operator_user_xyz
    bootstrap_users_enabled: true
  tasks:
    - name: Synthetic | validate docker group users usernames
      ansible.builtin.assert:
        that:
          - item | length > 0
        fail_msg: bootstrap_docker_users must not contain empty usernames.
      loop: "{{ bootstrap_docker_users | default([]) }}"
      loop_control:
        label: "{{ item }}"
      when: bootstrap_docker_users | default([]) | length > 0

    - name: Synthetic | inspect configured docker group users
      ansible.builtin.getent:
        database: passwd
        key: "{{ item }}"
      register: docker_configured_users_getent
      failed_when: false
      loop: "{{ bootstrap_docker_users | default([]) }}"
      loop_control:
        label: "{{ item }}"
      when:
        - bootstrap_docker_users | default([]) | length > 0
        - not (item == (bootstrap_admin_user | default('')) and (bootstrap_users_enabled | default(true) | bool))

    - name: Synthetic | verify configured docker group users exist on host
      ansible.builtin.assert:
        that:
          - item.ansible_facts.getent_passwd is defined
          - item.item in item.ansible_facts.getent_passwd
        fail_msg: >-
          User '{{ item.item }}' configured in bootstrap_docker_users was not found on the host.
          In server-bootstrap, only bootstrap_admin_user ('{{ bootstrap_admin_user | default('') }}')
          is created automatically. Any other users in bootstrap_docker_users must exist prior to running bootstrap.
      loop: "{{ docker_configured_users_getent.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - docker_configured_users_getent is defined
        - docker_configured_users_getent.results is defined
        - not (item.skipped | default(false))
