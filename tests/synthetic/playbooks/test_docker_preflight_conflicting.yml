---
- name: Synthetic | conflicting Docker state must fail docker preflight
  hosts: localhost
  gather_facts: false
  vars:
    docker_snap_installed: false
    docker_installed_conflicting_packages:
      - docker.io
    docker_has_unofficial_docker_apt_source: false
    docker_cli_present: false
    docker_missing_official_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    docker_installed_official_packages: []
    docker_has_official_apt_source: false
    docker_ce_from_official_origin: false
  tasks:
    - name: Synthetic | import conflicting Docker classification failure
      ansible.builtin.import_tasks: ../../../roles/docker/tasks/classify_state.yml
