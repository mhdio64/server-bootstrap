---
- name: Bootstrap | preflight
  hosts: all
  gather_facts: true
  become: true
  any_errors_fatal: true
  vars_files:
    - vars/bootstrap_internal.yml
  tasks:
    - name: Preflight | global checks
      ansible.builtin.import_tasks: tasks/preflight/global.yml

    - name: Preflight | common role checks
      ansible.builtin.import_role:
        name: common
        tasks_from: preflight
      when: bootstrap_common_enabled | default(true) | bool

    - name: Preflight | users role checks
      ansible.builtin.import_role:
        name: users
        tasks_from: preflight
      when: bootstrap_users_enabled | default(true) | bool

    - name: Preflight | ssh role checks
      ansible.builtin.import_role:
        name: ssh
        tasks_from: preflight
      when: bootstrap_ssh_enabled | default(true) | bool

    - name: Preflight | firewall role checks
      ansible.builtin.import_role:
        name: firewall
        tasks_from: preflight
      when: bootstrap_firewall_enabled | default(true) | bool

    - name: Preflight | security role checks
      ansible.builtin.import_role:
        name: security
        tasks_from: preflight
      when: bootstrap_security_enabled | default(true) | bool

    - name: Preflight | docker role checks
      ansible.builtin.import_role:
        name: docker
        tasks_from: preflight
      when: bootstrap_docker_enabled | default(true) | bool

    - name: Preflight | component opt-out warnings
      ansible.builtin.import_tasks: tasks/summary/component_opt_out_warnings.yml

- name: Bootstrap | apply
  hosts: all
  gather_facts: true
  become: true
  any_errors_fatal: true
  vars_files:
    - vars/bootstrap_internal.yml
  roles:
    - role: common
      when: bootstrap_common_enabled | default(true) | bool
    - role: users
      when: bootstrap_users_enabled | default(true) | bool
    - role: ssh
      when: bootstrap_ssh_enabled | default(true) | bool
    - role: firewall
      when: bootstrap_firewall_enabled | default(true) | bool
    - role: security
      when: bootstrap_security_enabled | default(true) | bool
    - role: docker
      when: bootstrap_docker_enabled | default(true) | bool
  tasks:
    - name: Apply | record target metadata
      ansible.builtin.import_tasks: tasks/post_apply/metadata.yml
      when: not ansible_check_mode

    - name: Apply | component opt-out warnings
      ansible.builtin.import_tasks: tasks/summary/component_opt_out_warnings.yml

    - name: Apply | reboot-required warning
      ansible.builtin.import_tasks: tasks/summary/reboot_required_warning.yml
      when: not ansible_check_mode
