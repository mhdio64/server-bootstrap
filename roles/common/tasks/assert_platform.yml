---
- name: Common | assert supported distribution
  ansible.builtin.assert:
    that:
      - ansible_distribution == common_supported_distribution
    fail_msg: >-
      Unsupported distribution {{ ansible_distribution | default('unknown') }}.
      server-bootstrap in Phase MD-1 officially validates Ubuntu Server 24.04 only.

- name: Common | assert supported distribution version
  ansible.builtin.assert:
    that:
      - ansible_distribution_version in (common_supported_distribution_versions | default([common_supported_distribution_version]))
    fail_msg: >-
      Unsupported {{ ansible_distribution | default('Ubuntu') }} version {{ ansible_distribution_version | default('unknown') }}.
      server-bootstrap in Phase MD-2 officially validates Ubuntu Server 22.04 and 24.04 LTS only.

- name: Common | assert supported CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in common_supported_architectures
    fail_msg: >-
      Unsupported architecture {{ ansible_architecture | default('unknown') }}.
      server-bootstrap v0.1.0 officially supports amd64 (x86_64) only.
