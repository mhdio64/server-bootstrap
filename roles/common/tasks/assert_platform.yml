---
- name: Common | assert supported distribution
  ansible.builtin.assert:
    that:
      - ansible_distribution in (common_supported_distributions | default([common_supported_distribution]))
    fail_msg: >-
      Unsupported distribution {{ ansible_distribution | default('unknown') }}.
      server-bootstrap in Phase MD-3 officially validates Ubuntu and Debian only.

- name: Common | assert supported distribution version
  ansible.builtin.assert:
    that:
      - >-
        (ansible_distribution == 'Ubuntu' and ansible_distribution_version in ['22.04', '24.04'])
        or (ansible_distribution == 'Debian' and (ansible_distribution_major_version | default('') == '13' or ansible_distribution_version in ['13', 'trixie']))
    fail_msg: >-
      Unsupported {{ ansible_distribution | default('OS') }} version {{ ansible_distribution_version | default('unknown') }}.
      server-bootstrap in Phase MD-3 officially validates Ubuntu 22.04, Ubuntu 24.04, and Debian 13 only.

- name: Common | assert supported CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in common_supported_architectures
    fail_msg: >-
      Unsupported architecture {{ ansible_architecture | default('unknown') }}.
      server-bootstrap v0.1.0 officially supports amd64 (x86_64) only.
