---
- name: Common | load platform-specific variables
  ansible.builtin.include_tasks: load_platform_vars.yml

- name: Common | verify supported platform
  ansible.builtin.import_tasks: assert_platform.yml

- name: Common | build effective package list for verification
  ansible.builtin.set_fact:
    common_packages_effective: >-
      {{ bootstrap_common_packages | union(bootstrap_common_packages_extra) | unique | sort }}

- name: Common | verify timezone is effective
  ansible.builtin.command: timedatectl show -p Timezone --value
  changed_when: false
  register: common_verify_timezone
  failed_when: common_verify_timezone.stdout | trim != bootstrap_timezone
  retries: 5
  delay: 3
  until: common_verify_timezone.rc == 0 and common_verify_timezone.stdout | trim == bootstrap_timezone

- name: Common | verify baseline packages are installed
  ansible.builtin.command: "dpkg-query -W -f='${Status}' {{ item }}"
  changed_when: false
  register: common_verify_package
  failed_when: "'install ok installed' not in common_verify_package.stdout"
  loop: "{{ common_packages_effective | default(bootstrap_common_packages) }}"
  loop_control:
    label: "{{ item }}"

- name: Common | verify time synchronization service is active
  ansible.builtin.systemd:
    name: "{{ common_timesync_service }}"
  register: common_verify_timesyncd
  failed_when: common_verify_timesyncd.status.ActiveState != 'active'
  retries: 5
  delay: 3
  until: common_verify_timesyncd.status.ActiveState | default('') == 'active'

- name: Common | verify reboot-required flag is detectable
  ansible.builtin.stat:
    path: "{{ common_reboot_required_file }}"
  register: common_verify_reboot_required
  changed_when: false

- name: Common | record reboot-required state for summary
  ansible.builtin.set_fact:
    bootstrap_reboot_required: "{{ common_verify_reboot_required.stat.exists }}"
    cacheable: true
