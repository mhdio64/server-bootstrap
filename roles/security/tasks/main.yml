---
- name: Security | load platform-specific variables
  ansible.builtin.include_tasks: load_platform_vars.yml

- name: Security | configure unattended-upgrades backend
  ansible.builtin.include_tasks: backends/unattended_upgrades.yml
  when: security_backend == 'unattended_upgrades'

- name: Security | configure dnf-automatic backend
  ansible.builtin.include_tasks: backends/dnf_automatic.yml
  when: security_backend == 'dnf_automatic'

- name: Security | configure system audit (auditd)
  ansible.builtin.include_tasks: auditd.yml
  when: bootstrap_security_auditd_enabled | default(true) | bool

- name: Security | configure kernel sysctl hardening
  ansible.builtin.include_tasks: sysctl.yml
  when: bootstrap_security_sysctl_enabled | default(true) | bool

- name: Security | configure modprobe protocol and filesystem blacklist
  ansible.builtin.include_tasks: modprobe.yml
  when: bootstrap_security_modprobe_blacklist_enabled | default(true) | bool

- name: Security | configure core dump restriction
  ansible.builtin.include_tasks: limits.yml
  when: bootstrap_security_coredump_disabled | default(true) | bool

- name: Security | configure login.defs password and umask policies
  ansible.builtin.include_tasks: login_defs.yml
  when: bootstrap_security_login_defs_enabled | default(true) | bool

- name: Security | configure legal warning banners
  ansible.builtin.include_tasks: banners.yml
  when: bootstrap_security_banner_enabled | default(true) | bool

- name: Security | harden sensitive file permissions
  ansible.builtin.include_tasks: file_permissions.yml
  when: bootstrap_security_file_permissions_enabled | default(true) | bool

- name: Security | configure fail2ban intrusion prevention
  ansible.builtin.include_tasks: fail2ban.yml
  when: bootstrap_security_fail2ban_enabled | default(true) | bool
