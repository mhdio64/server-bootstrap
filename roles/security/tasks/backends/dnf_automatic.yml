---
- name: Security | install dnf-automatic package
  ansible.builtin.dnf:
    name: "{{ security_packages }}"
    state: present

- name: Security | install project-owned dnf-automatic configuration
  ansible.builtin.template:
    src: server-bootstrap-automatic.conf.j2
    dest: "{{ security_dnf_automatic_conf }}"
    owner: root
    group: root
    mode: "0644"

- name: Security | enable and start dnf-automatic timer
  ansible.builtin.systemd:
    name: "{{ security_dnf_automatic_timer }}"
    enabled: true
    state: started
  when: not ansible_check_mode
