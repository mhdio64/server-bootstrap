---
- name: Docker | ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present
  when: bootstrap_docker_users | default([]) | length > 0

- name: Docker | check if docker group exists on host
  ansible.builtin.getent:
    database: group
    key: docker
  register: docker_group_getent
  failed_when: false
  when: bootstrap_docker_users | default([]) | length > 0

- name: Docker | add explicit users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ bootstrap_docker_users | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when:
    - bootstrap_docker_users | default([]) | length > 0
    - >-
      not ansible_check_mode or
      (docker_group_getent.ansible_facts.getent_group.docker is defined)
