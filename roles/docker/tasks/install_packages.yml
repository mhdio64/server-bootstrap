---
- name: Docker | query installed docker-ce version when present (APT)
  ansible.builtin.command:
    cmd: dpkg-query -W -f='${Version}' docker-ce
  register: docker_installed_ce_version_apt
  changed_when: false
  failed_when: false
  when:
    - bootstrap_docker_version != 'latest'
    - docker_package_manager == 'apt'
    - "'docker-ce' in (docker_installed_official_packages | default([]))"

- name: Docker | query installed docker-ce version when present (DNF)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: rpm -q --qf '%{VERSION}' docker-ce
  register: docker_installed_ce_version_dnf
  changed_when: false
  failed_when: false
  when:
    - bootstrap_docker_version != 'latest'
    - docker_package_manager == 'dnf'
    - "'docker-ce' in (docker_installed_official_packages | default([]))"

- name: Docker | record installed docker-ce version fact
  ansible.builtin.set_fact:
    docker_installed_ce_version: >-
      {{
        docker_installed_ce_version_apt
        if docker_package_manager == 'apt'
        else docker_installed_ce_version_dnf
      }}
  when: bootstrap_docker_version != 'latest'

- name: Docker | fail when requested Docker version is a downgrade
  ansible.builtin.fail:
    msg: >-
      Requested docker-ce version {{ bootstrap_docker_version }} is older than the
      installed version {{ docker_installed_ce_version.stdout | trim }}.
      server-bootstrap v0.1.0 does not perform automatic Docker downgrades.
  when:
    - bootstrap_docker_version != 'latest'
    - docker_installed_ce_version.stdout is defined
    - docker_installed_ce_version.stdout | trim | length > 0
    - docker_installed_ce_version.stdout is version(bootstrap_docker_version, '>')

- name: Docker | build Docker package install list for latest on fresh hosts
  ansible.builtin.set_fact:
    docker_package_install_list: "{{ docker_official_packages }}"
    docker_package_install_state: latest
  when:
    - bootstrap_docker_version == 'latest'
    - docker_state == 'absent'

- name: Docker | build Docker package install list for latest on compatible hosts
  ansible.builtin.set_fact:
    docker_package_install_list: "{{ docker_missing_official_packages | default([]) }}"
    docker_package_install_state: present
  when:
    - bootstrap_docker_version == 'latest'
    - docker_state == 'official_compatible'

- name: Docker | build Docker package install list for pinned versions (APT)
  ansible.builtin.set_fact:
    docker_package_install_list: >-
      {{
        (
          docker_versioned_packages
          | map('regex_replace', '^(.*)$', '\1=' ~ bootstrap_docker_version)
          | list
        )
        + (
          docker_official_packages
          | difference(docker_versioned_packages)
          | list
        )
      }}
    docker_package_install_state: present
  when:
    - bootstrap_docker_version != 'latest'
    - docker_package_manager == 'apt'

- name: Docker | build Docker package install list for pinned versions (DNF)
  ansible.builtin.set_fact:
    docker_package_install_list: >-
      {{
        (
          docker_versioned_packages
          | map('regex_replace', '^(.*)$', '\1-' ~ bootstrap_docker_version)
          | list
        )
        + (
          docker_official_packages
          | difference(docker_versioned_packages)
          | list
        )
      }}
    docker_package_install_state: present
  when:
    - bootstrap_docker_version != 'latest'
    - docker_package_manager == 'dnf'

- name: Docker | install official Docker packages via APT backend
  ansible.builtin.include_tasks: backends/apt/packages.yml
  when: docker_package_manager == 'apt'

- name: Docker | install official Docker packages via DNF backend
  ansible.builtin.include_tasks: backends/dnf/packages.yml
  when: docker_package_manager == 'dnf'
