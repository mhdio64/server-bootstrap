---
- name: Docker | ensure yum repos directory exists
  ansible.builtin.file:
    path: /etc/yum.repos.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Docker | install official Docker repository file
  ansible.builtin.get_url:
    url: "{{ docker_dnf_repo_url }}"
    dest: "{{ docker_dnf_repo_path }}"
    owner: root
    group: root
    mode: "0644"
    timeout: 30
  register: docker_dnf_repo_download
  until: docker_dnf_repo_download is success
  retries: 3
  delay: 5
