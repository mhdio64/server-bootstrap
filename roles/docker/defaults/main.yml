---
# Public API defaults for the docker role.
bootstrap_docker_enabled: true
bootstrap_docker_version: latest
bootstrap_docker_users: []

# Role-internal defaults (not public API).
docker_official_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_conflicting_packages:
  - docker.io
  - docker-compose
  - podman-docker
docker_official_apt_marker: download.docker.com/linux/ubuntu
docker_allowed_preflight_states:
  - absent
  - official_compatible
docker_project_apt_filename_prefix: server-bootstrap-docker
