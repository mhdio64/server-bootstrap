---
# Public API defaults for the docker role.
bootstrap_docker_enabled: true
bootstrap_docker_version: latest
bootstrap_docker_users: []

# Role-internal defaults (not public API).
docker_official_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_conflicting_packages:
  - docker.io
  - docker-compose
  - podman-docker
docker_official_apt_marker: download.docker.com/linux/ubuntu
docker_allowed_preflight_states:
  - absent
  - official_compatible
docker_project_apt_filename_prefix: server-bootstrap-docker
docker_apt_key_path: /etc/apt/keyrings/server-bootstrap-docker.asc
docker_apt_sources_path: /etc/apt/sources.list.d/server-bootstrap-docker.sources
docker_apt_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_apt_repository_uri: https://download.docker.com/linux/ubuntu
docker_apt_repository_component: stable
docker_daemon_json_path: /etc/docker/daemon.json
docker_service_name: docker
docker_containerd_service_name: containerd
docker_fresh_host_daemon_config:
  log-driver: local
docker_versioned_packages:
  - docker-ce
  - docker-ce-cli
