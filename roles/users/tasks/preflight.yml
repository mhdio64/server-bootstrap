---
- name: Users | load platform-specific variables
  ansible.builtin.include_tasks: load_platform_vars.yml

- name: Users | reject reserved root admin account name
  ansible.builtin.assert:
    that:
      - bootstrap_admin_user != 'root'
    fail_msg: >-
      bootstrap_admin_user must not be root. Use an existing sudo-capable account
      for the initial connection and configure a dedicated admin user instead.

- name: Users | build effective authorized key list
  ansible.builtin.import_tasks: build_authorized_keys.yml

- name: Users | require at least one effective authorized public key
  ansible.builtin.assert:
    that:
      - users_authorized_keys_effective | length > 0
    fail_msg: >-
      No usable SSH public keys were found. Configure bootstrap_admin_authorized_keys
      and/or bootstrap_admin_authorized_key_files.

- name: Users | classify existing admin account state
  ansible.builtin.import_tasks: classify_existing_user.yml

- name: Users | fail when admin account name is reserved for a system user
  ansible.builtin.fail:
    msg: >-
      Account {{ bootstrap_admin_user }} already exists as a system account (UID
      {{ users_admin_uid }}). Choose a different bootstrap_admin_user.
  when: users_admin_state == 'system_reserved'
