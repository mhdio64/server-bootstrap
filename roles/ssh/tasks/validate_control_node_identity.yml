---
- name: SSH | build effective authorized key list for identity checks
  ansible.builtin.import_tasks: ../../users/tasks/build_authorized_keys.yml

- name: SSH | initialize control node public key list
  ansible.builtin.set_fact:
    ssh_control_node_pubkeys: []

- name: SSH | collect public keys from ssh-agent on control node
  ansible.builtin.command: ssh-add -L
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  register: ssh_agent_pubkeys

- name: SSH | append ssh-agent public keys when available
  ansible.builtin.set_fact:
    ssh_control_node_pubkeys: >-
      {{
        ssh_control_node_pubkeys
        + (
          ssh_agent_pubkeys.stdout_lines
          | default([])
          | reject('match', '^The agent has no identities\\.')
          | reject('match', '^Error connecting to agent')
          | list
        )
      }}
  when: ssh_agent_pubkeys.rc == 0

- name: SSH | derive public key from ansible_ssh_private_key_file when configured
  ansible.builtin.command:
    cmd: "ssh-keygen -y -f {{ ansible_ssh_private_key_file | quote }}"
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  register: ssh_inventory_private_key_pubkey
  when: ansible_ssh_private_key_file is defined

- name: SSH | append inventory private key public half
  ansible.builtin.set_fact:
    ssh_control_node_pubkeys: >-
      {{
        ssh_control_node_pubkeys + [ssh_inventory_private_key_pubkey.stdout | trim]
      }}
  when:
    - ansible_ssh_private_key_file is defined
    - ssh_inventory_private_key_pubkey.rc == 0
    - ssh_inventory_private_key_pubkey.stdout | trim | length > 0

- name: SSH | resolve OpenSSH connection identity files from ssh -G
  ansible.builtin.command:
    cmd: >-
      ssh -G {{ ansible_user | quote }}@{{ ansible_host | quote }}
  delegate_to: localhost
  become: false
  changed_when: false
  register: ssh_connection_config

- name: SSH | extract identityfile paths from ssh -G output
  ansible.builtin.set_fact:
    ssh_identity_files: >-
      {{
        ssh_connection_config.stdout_lines
        | select('match', '^identityfile ')
        | map('regex_replace', '^identityfile ', '')
        | list
      }}

- name: SSH | derive public keys from resolved identity files
  ansible.builtin.command:
    cmd: "ssh-keygen -y -f {{ item | quote }}"
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  register: ssh_identity_file_pubkeys
  loop: "{{ ssh_identity_files | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: SSH | append public keys derived from identity files
  ansible.builtin.set_fact:
    ssh_control_node_pubkeys: >-
      {{
        ssh_control_node_pubkeys
        + (
          ssh_identity_file_pubkeys.results
          | default([])
          | selectattr('rc', 'equalto', 0)
          | map(attribute='stdout')
          | map('trim')
          | reject('equalto', '')
          | list
        )
      }}
  when: ssh_identity_files | default([]) | length > 0

- name: SSH | normalize control node public key list
  ansible.builtin.set_fact:
    ssh_control_node_pubkeys: >-
      {{ ssh_control_node_pubkeys | map('trim') | reject('equalto', '') | unique | list }}

- name: SSH | compute fingerprints for admin authorized keys
  ansible.builtin.command:
    cmd: ssh-keygen -lf -
    stdin: "{{ item }}\n"
  delegate_to: localhost
  become: false
  changed_when: false
  register: ssh_admin_key_fingerprints
  loop: "{{ users_authorized_keys_effective }}"
  loop_control:
    index_var: admin_key_index
    label: "admin key {{ admin_key_index + 1 }}"

- name: SSH | compute fingerprints for control node public keys
  ansible.builtin.command:
    cmd: ssh-keygen -lf -
    stdin: "{{ item }}\n"
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  register: ssh_control_node_key_fingerprints
  loop: "{{ ssh_control_node_pubkeys }}"
  loop_control:
    index_var: control_key_index
    label: "control node key {{ control_key_index + 1 }}"
  when: ssh_control_node_pubkeys | length > 0

- name: SSH | extract admin key fingerprint tokens
  ansible.builtin.set_fact:
    ssh_admin_fingerprint_tokens: >-
      {{
        ssh_admin_key_fingerprints.results
        | map(attribute='stdout')
        | map('regex_search', 'SHA256:[A-Za-z0-9+/=]+')
        | reject('equalto', none)
        | list
      }}

- name: SSH | extract control node fingerprint tokens
  ansible.builtin.set_fact:
    ssh_control_node_fingerprint_tokens: >-
      {{
        ssh_control_node_key_fingerprints.results
        | default([])
        | map(attribute='stdout')
        | map('regex_search', 'SHA256:[A-Za-z0-9+/=]+')
        | reject('equalto', none)
        | list
      }}
  when: ssh_control_node_pubkeys | length > 0

- name: SSH | require a control node identity matching configured admin keys
  ansible.builtin.assert:
    that:
      - ssh_control_node_pubkeys | length > 0
      - (ssh_admin_fingerprint_tokens | intersect(ssh_control_node_fingerprint_tokens | default([]))) | length > 0
    fail_msg: >-
      No control-node SSH identity matches the configured admin public keys.
      Load a matching private key into ssh-agent or set ansible_ssh_private_key_file
      before SSH hardening disables password authentication.
