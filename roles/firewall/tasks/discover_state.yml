---
- name: Firewall | query effective sshd port for firewall allowances
  ansible.builtin.command: /usr/sbin/sshd -T
  changed_when: false
  register: firewall_sshd_effective_raw

- name: Firewall | derive effective SSH port
  ansible.builtin.set_fact:
    firewall_effective_ssh_port: >-
      {{
        (
          firewall_sshd_effective_raw.stdout_lines
          | select('match', '^port ')
          | first
          | default('port 22')
          | regex_replace('^port ', '')
        ) | int
      }}

- name: Firewall | derive target SSH port for reconnect checks
  ansible.builtin.set_fact:
    firewall_target_ssh_port: >-
      {{
        bootstrap_ssh_port | default(firewall_effective_ssh_port) | int
      }}

- name: Firewall | determine whether IPv6 protection is required
  ansible.builtin.set_fact:
    firewall_ipv6_required: >-
      {{
        ansible_all_ipv6_addresses | default([]) | length > 0
        or (
          ansible_default_ipv6 is defined
          and ansible_default_ipv6.address is defined
          and ansible_default_ipv6.address not in ['', '::1']
        )
      }}

- name: Firewall | read IPv6 disable sysctl when present
  ansible.builtin.slurp:
    path: /proc/sys/net/ipv6/conf/all/disable_ipv6
  register: firewall_ipv6_disable_sysctl
  failed_when: false

- name: Firewall | refine IPv6 protection requirement
  ansible.builtin.set_fact:
    firewall_ipv6_required: >-
      {{
        firewall_ipv6_required | bool
        and (
          firewall_ipv6_disable_sysctl.failed | default(true)
          or (firewall_ipv6_disable_sysctl.content | b64decode | trim) == '0'
        )
      }}

- name: Firewall | capture current IPv4 filter rules
  ansible.builtin.command: /usr/sbin/iptables-save -t filter
  changed_when: false
  register: firewall_iptables_save_v4

- name: Firewall | capture current IPv6 filter rules when required
  ansible.builtin.command: /usr/sbin/ip6tables-save -t filter
  changed_when: false
  register: firewall_iptables_save_v6
  when: firewall_ipv6_required | bool
